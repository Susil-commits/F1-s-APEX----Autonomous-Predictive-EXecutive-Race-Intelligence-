[project]
name = "apex"
version = "0.1.0"
description = "APEX — Autonomous Predictive & EXecutive Race Intelligence"
readme = "APEX_Architecture_and_Design.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "gymnasium>=0.29.1",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "rich>=13.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "shap>=0.45.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "fastf1>=3.3.0",
    "ollama>=0.3.0",
    "sentence-transformers>=3.0.0",
    "mcp>=1.0.0",
    "slowapi>=0.1.9",
    "optuna>=3.6.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "W293"]
