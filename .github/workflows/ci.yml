name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r core/requirements.txt pytest pytest-asyncio ruff
      - name: Lint and compile check
        run: |
          python -m compileall -q core agents context tests
          ruff check --select F,E9,W6 core agents context tests
      - name: Run tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install, test, and build
        run: cd frontend && npm install && npm test && npm run build
