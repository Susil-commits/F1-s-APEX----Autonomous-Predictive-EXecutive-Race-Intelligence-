name: APEX Continuous Integration

on:
  push:
    branches: [ main, v1-only ]
  pull_request:
    branches: [ main, v1-only ]
  schedule:
    # Run weekly every Monday at 04:00 UTC (automated retraining & drift guard)
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  core-test-and-eval:
    name: Core ML Verification & Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync

      - name: Run Pytest Suite
        run: uv run pytest tests/ -v

      - name: Retrain Model & Benchmark Candidates
        run: uv run python -m core.training.train

      - name: Evaluate Temporal Holdout & Enforce Regression Threshold (R² >= 0.40)
        run: |
          uv run python -c "
          from core.training.evaluate import evaluate_model_temporal
          from core.training.train import get_core_model if hasattr(__import__('core.training.train'), 'get_core_model') else None
          import joblib
          import json
          artifact = joblib.load('backend/models/apex_core_v1_model.joblib')
          rep = evaluate_model_temporal(artifact)
          print(json.dumps(rep, indent=2))
          r2 = rep['metrics']['r2']
          cov = rep['metrics']['empirical_coverage']
          assert r2 >= 0.40, f'Model regression detected! Test holdout R²={r2:.3f} is below 0.40 baseline threshold.'
          assert cov >= 0.85, f'Conformal coverage degraded! Coverage={cov:.3f} is below 0.85 tolerance.'
          print(f'CI Verification Passed: Holdout R²={r2:.3f} >= 0.40, Empirical Coverage={cov:.3f} >= 0.85')
          "

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

  docker-build-test:
    name: Lean Docker Runtime Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [core-test-and-eval, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: docker build -t f1-apex-core .

      - name: Run Container & Verify Healthcheck
        run: |
          docker run -d --name apex-service -p 8000:8000 f1-apex-core
          sleep 5
          for i in {1..15}; do
            if curl -s -f http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "APEX Core container is healthy on iteration $i!"
              exit 0
            fi
            echo "Waiting for container ($i/15)..."
            sleep 2
          done
          echo "Healthcheck timed out! Container logs:"
          docker logs apex-service
          exit 1
