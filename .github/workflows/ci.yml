name: APEX Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & ML Verification
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apex_db
          POSTGRES_USER: apex_user
          POSTGRES_PASSWORD: apex_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync

      - name: Run Pytest Suite
        run: uv run pytest -v

      - name: Verify Model Registry & Weight Hashes Integrity
        run: |
          uv run python -c "from backend.app.intelligence.model_registry import ModelRegistry; res = ModelRegistry.verify_all_models(); assert res['overall_status'] == 'ALL_MODELS_HEALTHY', f'Model drift or missing artifact detected: {res}'"

      - name: Run Automated Evaluation & Regression Scoring Harness
        run: uv run python backend/eval/run_eval.py

      - name: Run Gate D Tyre Model Held-Out Evaluation
        run: uv run python backend/eval/tyre_model_eval.py

      - name: Run Gate J Reproducibility Benchmark Suite
        run: uv run python -m backend.eval.benchmark_runner --quick --seed 42

      - name: Run Sim-to-Real Historical Decision Replay Audit
        run: uv run python backend/eval/historical_replay_eval.py

      - name: Upload Evaluation & Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-evaluation-reports
          path: |
            backend/eval/latest_eval_report.json
            backend/eval/latest_benchmark_report.json
            backend/eval/tyre_model_eval_report.json
            backend/eval/sim_to_real_divergence_report.json
            benchmarks/latest_benchmark_results.json
            backend/models/registry.json
            backend/training/best_hyperparameters.json
            backend/models/curriculum_training_comparison.png
          if-no-files-found: ignore


  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

  docker-compose-test:
    name: Docker Compose Stack Integration Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Stack
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose up -d --build

      - name: Wait for APEX Services Health
        run: |
          HEALTHY=0
          for i in {1..35}; do
            if curl -s -f http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "APEX Application is UP and HEALTHY on iteration $i!"
              HEALTHY=1
              break
            fi
            echo "Waiting for APEX backend to be healthy ($i/35)..."
            sleep 3
          done
          if [ $HEALTHY -ne 1 ]; then
            echo "Healthcheck timed out! Showing container logs:"
            docker compose logs
            exit 1
          fi

      - name: Verify Health Endpoint Response
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8000/api/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'

      - name: Stop and Teardown Stack
        if: always()
        run: docker compose down -v
