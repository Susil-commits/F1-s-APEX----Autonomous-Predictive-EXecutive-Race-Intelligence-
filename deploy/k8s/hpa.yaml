apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apex-backend-hpa
  namespace: default
  labels:
    app: apex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apex-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
