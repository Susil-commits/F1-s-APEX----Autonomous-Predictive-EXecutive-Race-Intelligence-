apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-worker
  namespace: default
  labels:
    app: apex
    component: worker
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apex
      component: worker
  template:
    metadata:
      labels:
        app: apex
        component: worker
    spec:
      containers:
        - name: apex-worker
          image: apex-race-intelligence:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.app.jobs.workers"]
          envFrom:
            - configMapRef:
                name: apex-config
            - secretRef:
                name: apex-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
