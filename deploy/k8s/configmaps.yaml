apiVersion: v1
kind: ConfigMap
metadata:
  name: apex-config
  namespace: default
  labels:
    app: apex
    tier: config
data:
  PORT: "8000"
  ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000,https://apex.f1"
  REDIS_HOT_TTL_SECONDS: "300"
  REDIS_TIMEOUT_SECONDS: "3.0"
  KAFKA_BOOTSTRAP_SERVERS: "apex-kafka:9092"
  KAFKA_GROUP_ID: "apex-stream-processor"
  KAFKA_MOCK_MODE: "0"
  ENABLE_OTEL_TRACING: "1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://apex-jaeger:4317"
