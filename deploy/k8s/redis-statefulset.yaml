apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apex-redis
  namespace: default
  labels:
    app: apex
    tier: cache
spec:
  serviceName: apex-redis
  replicas: 1
  selector:
    matchLabels:
      app: apex
      tier: cache
  template:
    metadata:
      labels:
        app: apex
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: apex-redis
  namespace: default
  labels:
    app: apex
    tier: cache
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: apex
    tier: cache
