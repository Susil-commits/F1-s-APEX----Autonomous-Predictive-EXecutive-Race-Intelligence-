apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "apex-backend"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: apex.f1.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apex-backend
                port:
                  number: 8000
