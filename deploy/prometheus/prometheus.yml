global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "apex-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
        labels:
          environment: "production"
          service: "apex-race-intelligence"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
