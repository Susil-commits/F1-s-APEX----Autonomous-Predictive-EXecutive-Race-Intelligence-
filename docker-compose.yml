services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://apex_user:apex_password@postgres:5432/apex_db
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: apex-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: apex-postgres
    environment:
      POSTGRES_DB: apex_db
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_password
    ports:
      - "5432:5432"
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  apex_pgdata:
